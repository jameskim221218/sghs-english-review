<style>

.gn{font-size:12.5px;font-weight:700;color:var(--c-s);margin-bottom:3px}
.gd{font-size:12px;color:var(--text2);margin-bottom:5px;line-height:1.6}

[data-theme="dark"] .shl{background:#78350f;color:#fde68a}
.hidden{display:none!important}
.trans-body{font-size:13px;color:var(--text2);line-height:2;background:var(--surface2);border-radius:10px;padding:14px 16px}

.cg-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;padding-left:2px}

.trans-note{font-size:11px;font-weight:700;color:var(--c-s);display:inline-block;margin-right:6px;font-style:normal}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
@media(max-width:768px){.overlay.show{display:block}}
/* TYPE COLORS */
.reading .qbar{background:var(--c-r)}.reading .qnum{color:var(--c-r)}.reading .qtype{background:var(--c-rbg);color:var(--c-r)}
.lang .qbar{background:var(--c-l)}.lang .qnum{color:var(--c-l)}.lang .qtype{background:var(--c-lbg);color:var(--c-l)}
.blank .qbar{background:var(--c-b)}.blank .qnum{color:var(--c-b)}.blank .qtype{background:var(--c-bbg);color:var(--c-b)}
.struct .qbar{background:var(--c-s)}.struct .qnum{color:var(--c-s)}.struct .qtype{background:var(--c-sbg);color:var(--c-s)}
.summary .qbar{background:var(--c-u)}.summary .qnum{color:var(--c-u)}.summary .qtype{background:var(--c-ubg);color:var(--c-u)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
@media print{.sidebar,.topbar,.menubtn,.dkbtn,.prbtn,.legend{display:none!important}.main{margin-left:0!important}.qcard{box-shadow:none!important;break-inside:avoid}.qbody{max-height:none!important}.tpanel{display:block!important}.tabs{display:none!important}body{font-size:12px}.hero{background:#4f46e5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<script>
const TC = {r:'#4f46e5',l:'#059669',b:'#7c3aed',s:'#d97706',u:'#e11d48'};
const Q = [
  {
    id:'q20',num:20,type:'주장',tc:'reading',pts:'',
    topic:`팀 구성 시 개인(부분)뿐 아니라 전체적 관점도 반드시 확인해야 한다`,
    ks:`When assembling a team with a common goal, always check the <em class="hly">overall view</em> as well as <em class="hly">the individuals involved</em>.`,
    ksko:`공통 목표를 가진 팀을 구성할 때, 관련된 개인뿐만 아니라 전반적인 관점도 항상 확인하라.`,
    ans:`③`,anstxt:`팀을 구성할 때는 부분뿐만 아니라 전체를 고려해야 한다`,
    rat:[
      `'합성의 오류(fallacy of composition)'는 각 부분이 훌륭하다고 해서 전체가 반드시 좋은 것은 아님을 의미한다.`,
      `IT 관리자와 행정관이 모두 유능하지만 역할이 중복되어 테스트 결과가 누락되는 예시, 좋은 사람들로 구성된 팀도 프로젝트 자체가 실패할 수 있다는 예시가 논리를 뒷받침한다.`,
      `마지막 문장(always check the overall view as well as the individuals)이 필자의 핵심 주장을 직접 제시한다.`
    ],
    wrong:`①성공 가능성 높은 프로젝트 집중 — 지문에 없음 / ②개인 보상 — 언급 없음 / ④개인 능력 발휘를 이끄는 리더 — 전체 고려라는 핵심과 초점이 다름 / ⑤회의 방식 개선 — 전혀 무관`,
    vocab:[
      {w:`fallacy`,p:`n.`,m:`오류, 그릇된 생각`,s:3},
      {w:`composition`,p:`n.`,m:`구성, 합성`,s:2},
      {w:`productive`,p:`adj.`,m:`생산적인`,s:2},
      {w:`efficient`,p:`adj.`,m:`효율적인`,s:2},
      {w:`collate`,p:`v.`,m:`대조 확인하다`,s:2},
      {w:`doomed`,p:`adj.`,m:`실패가 예정된`,s:2},
      {w:`assemble`,p:`v.`,m:`모으다, 조립하다`,s:2},
      {w:`assume`,p:`v.`,m:`가정하다`,s:3},
      {w:`bring on board`,p:`phr.`,m:`합류시키다, 영입하다`,s:2},
      {w:`interact`,p:`v.`,m:`상호작용하다`,s:2},
      {w:`stable`,p:`adj.`,m:`안정적인`,s:2},
      {w:`allow for`,p:`phr.`,m:`~을 고려하다`,s:2},
      {w:`be in charge of`,p:`phr.`,m:`~을 담당하다`,s:2}
    ],
    structs:[
      {p:`fail to + V`,m:`~하지 못하다`},
      {p:`be composed of N`,m:`~으로 구성되다`},
      {p:`A as well as B`,m:`B뿐만 아니라 A도`},
      {p:`assume that S+V`,m:`~라고 가정하다`}
    ],
    grammar:[

const TRANS = {
  q20: `우리는 때때로 전체가 각 부분만큼 좋을 것이라고 가정할 수 있다. 예를 들어, 당신이 스타트업을 책임지고 있고, 함께 일하는 모든 사람이 생산적이고 효율적이라는 것을 안다고 가정해 보자. 그 결과, 스타트업 역시 생산적이고 효율적일 것이라고 가정하는 것이 논리적으로 보일 수 있지만, 이것이 반드시 사실은 아니다. 합성의 오류는 서로 다른 "부분들"이 어떻게 상호작용하는지를 고려하지 못한다 — 예를 들어, 효율적인 행정관과 매우 유능한 IT 책임자가 각자 상대방이 시제품 테스트 결과를 대조 확인하는 담당이라고 가정한다면, 문제가 생긴다. 마찬가지로, 좋은 사람들로 구성된 팀이라도 여전히 실패가 예정된 프로젝트를 진행하고 있을 수 있고, 좋은 아이디어들로 구성된 프로젝트라도 안정적인 중심이 부족할 수 있다. 공통 목표를 가진 팀을 구성할 때는, 관련된 개인들뿐만 아니라 항상 전체적인 관점도 확인하라.`,
  q21: `인간은 시각적 심상 능력이 뛰어나다. 우리의 뇌는 현실 세계에서 실제로 행동하는 위험이나 대가 없이 앞으로 할 행동을 예행 연습할 수 있는 세계의 내부 정신적 그림이나 모델을 만들어내는 이 능력을 진화시켰다. 심지어 하버드 대학교 심리학자 Steve Kosslyn의 뇌 영상 연구에서, 당신의 뇌가 실제로 장면을 볼 때와 마찬가지로 같은 영역을 사용하여 장면을 상상한다는 것을 보여주는 암시도 있다. 그러나 진화는 그러한 내부적으로 생성된 표상이 결코 실제만큼 진짜가 아니도록 만들어 놓았다. 이것은 당신의 유전자 편에서의 현명한 자제이다. 만약 당신의 세계 내부 모델이 완벽한 대체물이라면, 배가 고플 때마다 당신은 그저 연회에서 잔치를 즐기는 자신을 상상할 수 있을 것이다. 당신은 실제 음식을 찾을 동기가 없어 곧 굶어 죽게 될 것이다. 시인이 말했듯이, "당신은 배고픔의 허기진 끝을 잔치에 대한 단순한 상상으로 배부르게 할 수 없다."`,
  q22: `1%에서 100%까지 각각의 객관적 확률에 대해, 우리는 주관적 확률 가중치를 알고 싶어 한다. 우리가 결정을 내릴 때, 1%의 가능성을 정확히 1%처럼 취급하는가, 아니면 다른 무언가처럼 취급하는가? 일어날 수 있지만 가능성이 낮은 사건들 — 낮은 확률의 사건들 — 은 약 25%까지의 확률로 정의될 수 있다. 낮은 확률의 사건들은 그래야 하는 것보다 더 많이 결정에 반영되는 경향이 있다. 즉, 객관적으로 1%의 발생 가능성이 있는 사건이 주관적으로는 5%의 가능성이 있는 것처럼 보일 수 있다. 우리는 이러한 낮은 확률의 사건들이 발생할 가능성을 과대평가한다. 일반적으로, 확률이 낮을수록 그 가능성을 더 많이 과대평가한다. 예를 들어, 복권을 하는 사람들은 종종 당첨에 대해 낙관적이다. 그러나 미국에서 가장 크고 인기 있는 복권에서 단 한 장의 티켓이 당첨될 확률은 1억 7500만분의 1 수준이다.`,
  q23: `무역의 장벽들 중 많은 부분은 시장이나 고객의 부족 때문이 아니라, 제품을 경쟁력 있는 가격으로 시장에 출시하는 데 큰 장벽이 있기 때문에 존재한다. 거래 비용은 기업들에게 상당하다 — 단순한 교환 비용뿐만 아니라, 상품과 서비스에 대금을 지불하기 위해 자금을 환전하고, 지불하고, 헤지 거래를 하는 비용도 포함된다. 공통 화폐를 갖는다는 것은 그러한 거래 비용의 많은 부분이 사라지고, 그 절약분이 기업의 생산성과 혁신에 재투자될 수 있다는 것을 의미한다. 기본적으로, 쓸모없는 비용이 생산적인 비용으로 바뀐다 — 경제 전체에 장기적인 이익을 가져다주면서. 일부 화폐를 통일함으로써, 경제 전체가 독립적으로 운영될 때보다 더 많은 이익을 얻고 성장한다. 따라서 공통 화폐는 모두가 이익을 얻을 수 있는 강력한 경제적 기반을 제공한다.`,
  q24: `우리에게 가장 가까운 별에서 오는 빛조차 우리에게 도달하는 데 4년이 걸린다. 우리가 별들을 바라볼 때, 우리는 시간을 거슬러 보는 것이다. 이것은 놀라운 선물이다. 우리는 우주의 일부를 수년 전의 모습 그대로 볼 수 있다. 우리가 더 멀리에서 빛을 수집할 수 있을수록, 우리는 시간을 더 멀리 거슬러 볼 수 있다. 오리온자리에서 빛나는 밝은 별 베텔게우스를 바라본다면, 당신은 600년 이상 시간을 되감는 것이다. 그 불그스름한 빛은 중세 시대에 지구를 향한 여정을 시작했다. 오리온자리의 허리띠에 있는 별들은 훨씬 더 멀리 있다. 수세대의 인간들에게 친숙한 그 빛은 우리에게 도달하기 위해 최소 1,000년을 여행했다. 이는 우리가 우주의 더 먼 부분들을 과거에 있었던 모습으로, 수천 년 혹은 수백만 년 혹은 수십억 년 전의 모습으로 볼 수 있기 때문에 우주의 역사를 이해할 기회가 있음을 의미한다.`,
  q29: `저명한 영국 철학자 Alfred North Whitehead는 "문명은 생각하지 않고도 수행할 수 있는 작업의 수를 늘림으로써 발전한다"고 주장했다. 예를 들어, 할인 쿠폰이 문명에 가져다주는 "발전"을 생각해 보자. 할인 쿠폰은 소비자들이 쿠폰을 제시함으로써 구매 가격을 낮출 수 있다고 가정하게 해 준다. 우리가 그 가정에 기계적으로 작동하는 법을 배운 정도는 한 자동차 타이어 회사의 경험에서 잘 드러난다. 인쇄 오류 때문에 수령자에게 아무런 할인도 제공하지 않은 우편 발송 쿠폰이, 상당한 할인을 제공한 오류 없는 쿠폰만큼이나 많은 고객 반응을 만들어 냈다. 여기서 명백하지만 교훈적인 점은 우리가 할인 쿠폰이 이중적인 역할을 하기를 기대한다는 것이다. 우리는 쿠폰이 돈을 절약해 줄 뿐만 아니라, 어떻게 해야 하는지 생각하는 데 필요한 시간과 정신적 에너지도 절약해 주기를 기대한다. 오늘날 세계에서, 우리는 지갑의 부담을 처리하기 위해 첫 번째 장점이 필요하지만, 잠재적으로 더 중요한 것인 뇌의 부담을 처리하기 위해 두 번째 장점도 필요하다.`,
  q30: `보통, 혁신적인 첨단 기술 제품들은 낮은 가격 탄력성을 가진다. 이는 가격의 큰 변화가 — 인상이든 인하든 — 수요를 크게 변화시키지 않는다는 것을 의미한다. 이러한 첨단 기술 제품들은 대체품이 거의 없어, 다른 제품으로 전환하는 비용이 높다. 또한, 기술의 초기 단계에서, 구매자들 — 혁신가나 선구자들 — 은 추가적인 성능보다 가격에 ③ 덜 민감하다. 그들은 종종 재력이 있거나 새롭고 혁신적이며 뛰어난 제품을 위해 많은 돈을 지불할 의향이 있다. 예를 들어, 새로운 제품 라인과 함께 고급 휴대폰 제조사는 250만 달러 이상의 자산을 가진 백만장자 가구의 3%를 목표로 하고 있다. 그들은 제조사가 설정한 가격대를 기꺼이 받아들일 고객들이다. 그 단계에서, 경쟁사들은 가격에 민감하지 않은 같은 고객층을 쫓고 있기 때문에, 자신들의 가격을 크게 낮추는 데 전혀 관심이 없다. 더욱이, 이러한 제품들의 높은 가격은 종종 품질의 표시로 인식되어 회사에 대한 고객의 신뢰를 강화한다.`,
  q31: `도시의 거리나 광장이 가진 쉽게 과소평가되는 특징 하나는 그것의 '미래에도 견디는' 성격이다. Marrakesh와 Siena 같은 곳의 오래된 중세 광장들은 지난 500년 동안 판매되는 물건 자체는 바뀌었더라도 여전히 매일 물건이 팔리는 장소이다. 도시 광장은 상당히 미래 변화에 잘 견디는 기술이며, 온라인 쇼핑 시대에도 쇼핑 거리가 그러한 것과 같다. 예를 들어, 한때 마차 채찍과 타자기를 팔던 같은 물리적 가게가 이제는 손상된 휴대전화를 수리하고 버블티를 팔 수 있다. 같은 기반 시설이 [① 변화하는 용도]를 뒷받침하는 것이다. 도시 경제의 위대한 예언자인 Jane Jacobs는 『미국 대도시의 죽음과 삶』과 『경제의 본질』을 포함한 자신의 책들에서 이 사실을 매우 중시했다. 그녀가 지적했듯이, 도시 건축의 큰 장점은 용도 변화에 적응할 수 있는 능력이다. Jacobs는 인터넷의 부상이 도시의 죽음을 의미할 것이라고 예측한 사람들과 달리, 도시 자체의 지속성을 정확히 예측했다.`,
  q32: `유전체학 혁명은 접촉이 더 깊은 차원에서 식물에게 얼마나 영향을 미치는지 볼 수 있게 해 주었다. 겨자 계열의 잡초 식물이자 식물 생물학계의 실험용 쥐인 애기장대(Arabidopsis thaliana)의 유전자를 들여다보며, 연구자들은 접촉이 호르몬과 유전자 발현에 극적인 반응을 조용히 촉발시켜서 그것이 성장을 상당히 ② 억제할 수 있음을 발견했다. 그들은 부드러운 붓으로 애기장대를 쓰다듬고 나서 식물의 유전적 반응을 분석했다. 접촉 후 30분 이내에, 식물 전체 게놈의 10%가 변화했다. 분명히, 식물은 혼란에 대처하기 위해 우선순위를 재조정하고, 더 높이 자라는 힘든 작업에서 에너지를 다른 곳으로 전환하고 있었다. 여러 번 접촉된 애기장대는 위쪽 성장률을 최대 30%까지 줄였다.`,
  q33: `진화는 환경 조건에 어떤 변화가 생기기 전까지는 정지 상태에 이르게 될 것이다. 예를 들어 빙하기의 시작, 그 지역의 평균 강수량 변화, 또는 우세한 바람의 방향 변화와 같은 것이 있을 수 있다. 이러한 변화들은 우리가 진화적 시간 규모처럼 매우 긴 시간 단위를 다룰 때 실제로 일어난다. 그 결과, 진화는 보통 멈추는 것이 아니라 변화하는 환경을 끊임없이 따라간다. 만약 어떤 지역의 평균 기온이 꾸준히 낮아지는 경향이 있고, 그 경향이 수 세기 동안 지속된다면, 동물들의 연속된 세대는 예컨대 더 긴 털을 기르는 방향으로 지속적인 선택 '압력'에 의해 밀려가게 될 것이다. 낮아진 기온이 몇천 년 동안 지속된 후 그 추세가 반대로 바뀌어 평균 기온이 다시 서서히 올라간다면, 동물들은 새로운 선택 압력의 영향을 받게 되고, 다시 더 짧은 털을 기르는 방향으로 밀려가게 될 것이다.`,
  q35: `우리가 예술 작품의 내용을 인식하고 이해할 수 있는지 판단하기 위해 작품을 볼 때 우리가 거치는 과정은 단순히 시각적인 것이 아니다. ① 그것은 또한 정신적인 과정이며, 주로 우리가 식별하고 분류할 수 있는 작품 내부와 주변의 요소들을 기반으로 한다. ② 우리가 보고 생각할 때, 작품이 어디에 있는지, 언제 만들어졌는지, 어떤 문화에서 나왔는지, 누가 만들었는지, 또는 왜 만들어졌는지에 의해 작품의 의미에 대한 단서를 얻을 수 있다. ③ 우리는 작품의 배경, 창작자 또는 역사적 맥락의 영향을 받지 않고 있는 그대로 예술 작품을 이해하려고 노력해야 한다. [← 무관 문장] ④ 우리가 수집할 수 있는 모든 정보는 작품의 맥락, 즉 어떤 역사적, 사회적, 개인적, 정치적, 또는 과학적 이유로 만들어졌는지를 이해하는 데 도움이 된다. ⑤ 그리고 나서, 우리가 수집한 모든 맥락적 정보를 활용하여, 예술 작품의 내용을 해석하여 그것이 무엇을 의미하거나 상징하는지 발견한다.`,
  q37: `여러분이 깜짝 놀랐던 때를 생각해 보라. 여러분은 위협이 있는지 주변 환경을 살피면서 갑자기 멈추고, 모든 움직임을 멈춘 채 얼어붙고, 숨을 참았는가?

(C) 이러한 모든 반응은 우리가 발각되는 것을 피하고, 가능한 위험의 근원을 찾아내며, 싸우거나 도망칠 준비를 하는 능력을 극대화한다. 언어가 아무리 정교해졌다고 해도, 언어는 여전히 소리를 만들어 내는 것이며, 그 소리는 잠재적인 포식자에게 우리의 위치를 드러낼 수도 있다.

(B) 이 때문에 동결 반응은 매우 스트레스가 크고 충격적인 상황에서 언어의 억제를 초래한다. 자연 선택은 언어의 진화를 촉진했지만, 동결 규칙은 보존했다. 위협이 지나가면, 우리는 긴장을 풀기 시작하고 다시 목소리를 되찾으며, 어쩌면 우리 자신의 반응을 보고 웃기까지 할 수도 있다.

(A) 하지만 우리가 결코 긴장을 풀 수 없다면 어떨까? 우리의 경험이 우리의 뇌를 끊임없는 공포 상태에 있도록 만든다면 어떨까? 신경망의 적절한 발달과 통합에 대한 이러한 방해는 만성 스트레스와 심지어 정신 질환을 초래할 수 있다.`,
  q38: `비디오 게임은 공감과 관련하여 가장 많이 연구된 기술 중 하나이다. ( ① ) 폭력적인 비디오 게임이 청소년에게 미치는 영향에 대한 오래된 우려가 있었기 때문에, 지난 수십 년간 이 주제에 대해 많은 연구가 이루어졌다. ( ② ) 비디오 게임 폭력의 영향을 측정하고 기록하는 동안, 과학자들은 비디오 게임이 공감에 어떻게 영향을 미칠 수 있는지에 대한 신뢰할 만한 설명을 공식화했다. ( ③ ) 폭력적인 사건을 목격하는 것에 대한 정상적이고 건강한 반응의 일부는 부정적인 감정을 느끼고, 두려움이나 혐오감과 연결된 생리적 각성을 경험하는 것이다. ( ④ ) 폭력적인 사건에 반복적으로 노출되면 — 예를 들어 폭력적인 비디오 게임을 하는 사람에게 일어날 수 있는 것처럼 — 이 정상적인 반응이 둔해질 수 있으며, 이는 둔감화라는 현상으로 알려져 있다. ( ⑤ 정답 위치 ▼ ) 이 문제적 과정의 다음 단계는 폭력에 대해 감소된 감정적 반응을 갖는 것이 될 것이며, 이는 또한 타인을 인식하거나 그들에게 공감하는 능력을 방해할 수도 있어, 공감 능력 감소로 이어진다. [삽입 문장 끝] 광범위한 폭력적 비디오 게임과 사람들의 감소된 공감 능력 사이의 연관성을 보여주는 상당한 연구가 있다.`,
  q40: `뇌는 일정한 박자의 모델 — 스키마 — 을 만들어야 하며, 그래야 우리는 음악가들이 그것을 따르지 않을 때를 알 수 있다. 이것은 멜로디의 변주와 비슷하다: 우리는 음악가가 멜로디를 자유롭게 변형하고 있을 때를 알고 감상하기 위해 멜로디가 무엇인지에 대한 심적 표상을 가질 필요가 있다. 운율 추출, 즉 박자가 무엇이고 언제 나타날 것으로 예상하는지 아는 것은 음악적 감동의 중요한 부분이다. 음악은 기대의 체계적인 위반을 통해 우리에게 감정적으로 소통한다. 이러한 위반들은 음높이, 리듬, 빠르기 등의 어떤 영역에서도 일어날 수 있다 — 하지만 반드시 일어나야 한다. 음악은 조직된 소리이지만, 그 조직에는 예상치 못한 요소가 포함되어야 하며, 그렇지 않으면 음악은 감정적으로 평범하고 기계적이 된다. 너무 많은 조직화는 기술적으로 여전히 음악일 수 있지만, 아무도 듣고 싶어 하지 않는 음악이 될 것이다.`
};

const SECTIONS = [
  {label:`📖 독해 유형 (20~24번)`,ids:[`q20`,`q21`,`q22`,`q23`,`q24`]},
  {label:`✏️ 어법·어휘 (29~30번)`,ids:[`q29`,`q30`]},
  {label:`🔲 빈칸 추론 (31~33번)`,ids:[`q31`,`q32`,`q33`]},
  {label:`🔀 문장 구조 (35·37·38번)`,ids:[`q35`,`q37`,`q38`]},
  {label:`📋 요약 완성 (40번)`,ids:[`q40`]}
];

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n)}

function cardHTML(q){
  const ratHtml = q.rat.map(r=>`<li class="ritem">${esc(r)}</li>`).join('');
  const wHtml = q.wrong ? `<div class="wbox"><span class="wlbl">✕ 오답 분석</span>${esc(q.wrong)}</div>` : '';
  const vocHtml = q.vocab.map(v=>`<div class="vcard"><div class="vw">${esc(v.w)}<span class="vp">${esc(v.p)}</span></div><div class="vm">${esc(v.m)}</div><div class="vs">${stars(v.s)}</div></div>`).join('');
  const strHtml = q.structs.map(s=>`<div class="sitem"><div class="sp">${esc(s.p)}</div><div class="sarr">→</div><div class="sm">${esc(s.m)}</div></div>`).join('');
  const gramHtml = q.grammar.map(g=>`<div class="gitem"><div class="gn">${esc(g.n)}</div><div class="gd">${esc(g.d)}</div><div class="gex">${esc(g.ex)}</div></div>`).join('');
  const tipHtml = q.tips.map(t=>`<li class="titem"><span class="tick">✔</span><span>${esc(t)}</span></li>`).join('');
  const transHtml = TRANS[q.id] ? esc(TRANS[q.id]) : '해석을 준비 중입니다.';
  const pid = q.id;
  return `
<div class="qcard ${q.tc}" id="${pid}">
  <div class="qhead" onclick="tog('${pid}')">
    <div class="qbar"></div>
    <div class="qnum">${q.num}</div>
    <div class="qtype">${esc(q.type)}</div>
    <div class="qtopic">${esc(q.topic)}</div>
    ${q.pts?`<div class="qpts">${esc(q.pts)}</div>`:''}
    <svg class="qchev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <div class="qbody">
    <div class="qinner">
      <div class="ansbox">
        <div class="ansnum">${esc(q.ans)}</div>
        <div class="anstxt"><span class="anslbl">정 답</span>${esc(q.anstxt)}</div>
      </div>
      <div class="kswrap">
        <div class="kslbl">📌 주제 문장 (Topic Sentence)</div>
        <div class="ks">${q.ks}</div>
        <div class="ksko">${esc(q.ksko)}</div>
      </div>
      <div class="tabs" id="tabs-${pid}">
        <button class="tbtn active" onclick="tab('${pid}','rat',this)">정답 근거</button>
        <button class="tbtn" onclick="tab('${pid}','voc',this)">어휘 및 표현</button>
        <button class="tbtn" onclick="tab('${pid}','cg',this)">구문 및 문법</button>
        <button class="tbtn" onclick="tab('${pid}','tip',this)">출제 포인트</button>
        <button class="tbtn" onclick="tab('${pid}','trs',this)">🇰🇷 해석</button>
      </div>
      <div class="tpanel active" id="${pid}-rat"><ul class="rlist">${ratHtml}</ul>${wHtml}</div>
      <div class="tpanel" id="${pid}-voc"><div class="vgrid">${vocHtml}</div></div>
      <div class="tpanel" id="${pid}-cg">
        <div class="slist">${strHtml}</div>
        <div class="glist" style="margin-top:10px">${gramHtml}</div>
      </div>
      <div class="tpanel" id="${pid}-tip"><ul class="tlist">${tipHtml}</ul></div>
      <div class="tpanel" id="${pid}-trs"><div class="trans-body">${transHtml}</div></div>
    </div>
  </div>
</div>`;
}

function buildPage(){
  // Cards
  const ca = document.getElementById('ca');
  let html = '';
  SECTIONS.forEach(sec => {
    html += `<div class="slbl">${sec.label}</div>`;
    sec.ids.forEach(id => {
      const q = Q.find(x=>x.id===id);
      if(q) html += cardHTML(q);
    });
  });
  ca.innerHTML = html;

  // Nav
  const nav = document.getElementById('navList');
  const navTCmap = {reading:'독해유형',lang:'어법·어휘',blank:'빈칸추론',struct:'문장구조',summary:'요약'};
  SECTIONS.forEach(sec => {
    const g = document.createElement('div');
    g.className = 'nav-g';
    const firstQ = Q.find(x=>x.id===sec.ids[0]);
    const col = firstQ ? TC[firstQ.tc[0]] : '#888';
    g.style.color = col;
    g.textContent = sec.label.replace(/^[^\s]+\s/,'');
    nav.appendChild(g);
    sec.ids.forEach(id => {
      const q = Q.find(x=>x.id===id);
      if(!q) return;
      const c = TC[q.tc[0]];
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.id = 'nav-'+id;
      btn.innerHTML = `<div class="nd" style="background:${c}"></div><span>${q.num}번</span><span class="nb" style="background:${c}22;color:${c}">${q.type}</span>`;
      btn.onclick = ()=>{jumpTo(id);closeSB();};
      nav.appendChild(btn);
    });
  });
}

function tog(id){
  const card = document.getElementById(id);
  card.classList.toggle('open');
  updateNav();
}

function tab(id,panelKey,btn){
  const tabsEl = document.getElementById('tabs-'+id);
  tabsEl.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['rat','voc','cg','tip','trs'].forEach(k=>{
    const p = document.getElementById(id+'-'+k);
    if(p) p.classList.toggle('active', k===panelKey);
  });
}

function jumpTo(id){
  const el = document.getElementById(id);
  if(!el) return;
  if(!el.classList.contains('open')) el.classList.add('open');
  setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),80);
  updateNav();
}

function updateNav(){
  const y = window.scrollY + 80;
  let active = null;
  Q.forEach(q=>{const el=document.getElementById(q.id);if(el&&el.offsetTop<=y)active=q.id;});
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  if(active){const n=document.getElementById('nav-'+active);if(n)n.classList.add('active');}
}

function toggleDark(){
  const h = document.documentElement;
  const dark = h.getAttribute('data-theme')==='dark';
  h.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('di').textContent = dark?'🌙':'☀️';
  document.getElementById('dl').textContent = dark?'다크':'라이트';
  localStorage.setItem('t',dark?'light':'dark');
}

let stimer;
function doSearch(val){
  clearTimeout(stimer);
  stimer = setTimeout(()=>runSearch(val.trim()),200);
}

function runSearch(v){
  removeHL();
  const cards = document.querySelectorAll('.qcard');
  if(!v){cards.forEach(c=>c.classList.remove('hidden'));document.getElementById('sc').textContent='';return;}
  let cnt=0;
  cards.forEach(c=>{
    if(c.innerText.toLowerCase().includes(v.toLowerCase())){
      c.classList.remove('hidden');cnt++;
      addHL(c,v);
    } else {
      c.classList.add('hidden');
    }
  });
  document.getElementById('sc').textContent = cnt?cnt+'개 지문':'결과 없음';
}

function addHL(node,v){
  const walker = document.createTreeWalker(node,NodeFilter.SHOW_TEXT,null,false);
  const nodes=[];let n;
  while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(n=>{
    if(!n.parentElement||n.parentElement.className==='shl') return;
    const i=n.textContent.toLowerCase().indexOf(v.toLowerCase());
    if(i===-1) return;
    const span=document.createElement('span');
    span.innerHTML=n.textContent.replace(new RegExp(`(${v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark class="shl">$1</mark>');
    n.parentNode.replaceChild(span,n);
  });
}

function removeHL(){
  document.querySelectorAll('mark.shl').forEach(m=>{
    const p=m.parentNode;if(p){p.replaceChild(document.createTextNode(m.textContent),m);p.normalize();}
  });
}

function toggleSB(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSB(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

window.addEventListener('DOMContentLoaded',()=>{
  buildPage();
  if(localStorage.getItem('t')==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('di').textContent='☀️';
    document.getElementById('dl').textContent='라이트';
  }
  window.addEventListener('scroll',updateNav,{passive:true});
});
</script>
</body>
</html>
